<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>GOS Admin — Gruppe Offene Synode</title>
  <link rel="stylesheet" href="admin.css?v=3">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@300;400;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&display=swap" rel="stylesheet">
</head>
<body>

  <!-- Loading Screen -->
  <div id="loadingScreen" class="admin-loading">
    <div class="spinner"></div>
  </div>

  <!-- Login Screen -->
  <div id="loginScreen" class="admin-login" style="display:none">
    <div class="login-card">
      <div class="login-header">
        <div class="login-logo">✦ GOS</div>
        <h1>Admin Portal</h1>
        <p>Anmeldung für Administratoren</p>
      </div>
      <button id="btnGoogleSignIn" class="btn-google" type="button">
        <svg viewBox="0 0 24 24" width="20" height="20">
          <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 0 1-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z"/>
          <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
          <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18A10.96 10.96 0 0 0 1 12c0 1.77.42 3.45 1.18 4.93l3.66-2.84z"/>
          <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
        </svg>
        Mit Google anmelden
      </button>
      <div class="login-divider"><span>oder</span></div>
      <form id="emailLoginForm" class="login-form">
        <input type="email" id="loginEmail" placeholder="E-Mail-Adresse" autocomplete="email" required>
        <input type="password" id="loginPassword" placeholder="Passwort" autocomplete="current-password" required>
        <button type="submit" class="btn-primary" style="width:100%">Anmelden</button>
      </form>
      <div id="loginError" class="login-error"></div>
    </div>
  </div>

  <!-- Access Denied Screen -->
  <div id="accessDenied" class="admin-login" style="display:none">
    <div class="login-card access-denied-card">
      <div class="denied-icon">🚫</div>
      <h1>Zugang verweigert</h1>
      <p>Ihr Konto hat keine Administrator-Berechtigung. Mitglieder melden sich direkt auf der Website an, um die Dokumente zu sehen.</p>
      <button id="btnLogoutDenied" class="btn-primary" type="button">Abmelden</button>
    </div>
  </div>

  <!-- Dashboard -->
  <div id="dashboard" style="display:none">
    <header class="admin-header">
      <div class="admin-header-inner">
        <div class="admin-brand">
          <a href="index.html" title="Zur Hauptseite" style="color:inherit;text-decoration:none">✦ GOS</a>
          <span>Admin</span>
        </div>
        <div class="admin-user">
          <span id="userDisplay" class="admin-user-email"></span>
          <a href="editor.html" class="btn-editor" target="_blank" rel="noopener" title="Website per Chat anpassen">✎ Website-Editor</a>
          <button id="btnLogout" class="btn-logout" type="button">Abmelden</button>
        </div>
      </div>
    </header>

    <main class="admin-main">
      <nav class="admin-tabs">
        <button class="tab-btn active" data-tab="events" type="button">Termine</button>
        <button class="tab-btn" data-tab="documents" type="button">Dokumente</button>
        <button class="tab-btn" data-tab="users" type="button">Benutzer</button>
      </nav>

      <!-- Events Panel -->
      <div id="panel-events" class="admin-panel">
        <div class="panel-header">
          <h2>Termine</h2>
          <button id="btnAddEvent" class="btn-primary" type="button">+ Neuer Termin</button>
        </div>
        <div id="eventsList" class="items-list">
          <div class="items-loading"><div class="spinner"></div></div>
        </div>
      </div>

      <!-- Documents Panel -->
      <div id="panel-documents" class="admin-panel" style="display:none">
        <div class="panel-header">
          <h2>Dokumente</h2>
          <button id="btnAddDoc" class="btn-primary" type="button">+ Neues Dokument</button>
        </div>
        <div id="docsList" class="items-list">
          <div class="items-loading"><div class="spinner"></div></div>
        </div>
      </div>

      <!-- Users Panel -->
      <div id="panel-users" class="admin-panel" style="display:none">
        <div class="panel-header">
          <h2>Benutzer</h2>
          <div class="panel-actions"><button id="btnAddMember" class="btn-primary" type="button">+ Mitglied</button><button id="btnAddUser" class="btn-secondary" type="button">+ Admin</button></div>
        </div>
        <div id="usersList" class="items-list">
          <div class="items-loading"><div class="spinner"></div></div>
        </div>
      </div>
    </main>
  </div>

  <!-- Modal Overlay -->
  <div id="modal" class="modal-overlay" style="display:none">
    <div class="modal-content">
      <div class="modal-header">
        <h3 id="modalTitle">Modal</h3>
        <button id="modalClose" class="modal-close" type="button">&times;</button>
      </div>
      <div id="modalBody" class="modal-body"></div>
    </div>
  </div>

  <!-- Toast -->
  <div id="toast" class="toast"></div>

  <script type="module" src="admin.js?v=2"></script>
</body>
</html>
